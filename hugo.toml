# Site settings
baseURL = 'https://jakobschumacher.github.io/'
languageCode = 'de-de'
title = 'Jakob Schumacher'
theme = 'PaperMod'

# Enable robots.txt generation
enableRobotsTXT = true

# Copyright
copyright = "&copy;2025 Jakob Schumacher"

[params]
  # Metadata for search engines and social sharing
  author = "Jakob Schumacher"
  description = "Webseite von Jakob Schumacher - Infektionsepidemiologe, Mediziner, Data scientist und Dozent"

  # Logo in header
  [params.label]
    text = "Jakob Schumacher"
    icon = "/logo.png"
    iconHeight = 35

  # Favicon
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon.ico"
    favicon32x32 = "/favicon.ico"
    apple_touch_icon = "/logo.png"

  # Theme mode (toggle disabled = no moon/sun button)
  defaultTheme = "light" # auto, light, dark
  disableThemeToggle = true

  # Show reading time and word count
  ShowReadingTime = true
  ShowWordCount = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = false

  # Homepage mode
  [params.homeInfoParams]
    Title = "Jakob Schumacher"
    Content = """
Infektionsepidemiologe. Mediziner. Data Scientist.

Willkommen auf meiner persönlichen Webseite. Ich arbeite als Infektionsepidemiologe im öffentlichen Gesundheitsdienst und bin spezialisiert auf die Überwachung und Kontrolle von meldepflichtigen Infektionskrankheiten.

Meine Arbeit umfasst die epidemiologische Analyse von Ausbrüchen, die Entwicklung von Präventionsstrategien und die Schulung von medizinischem Personal. Zudem entwickle ich digitale Werkzeuge und Lehrmaterialien für den öffentlichen Gesundheitsdienst.
    """

  # Social icons
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/jakobschumacher"

  [[params.socialIcons]]
    name = "orcid"
    url = "https://orcid.org/0000-0002-9894-6085"

# Menu
[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

# Markup settings
[markup]
  [markup.highlight]
    style = 'monokai'
    lineNos = false
