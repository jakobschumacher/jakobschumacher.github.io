<h1><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
{{if .Site.Params.homeSubtitle }}<p>{{ .Site.Params.homeSubtitle }}</p>{{ end }}
<nav>
  {{ range .Site.Menus.main }}
    <a href="{{ .URL }}">{{ .Name }}</a>
  {{ end }}
  {{if .Site.Params.github }}<a href="{{ .Site.Params.github }}" target="_blank">GitHub</a>{{ end }}
</nav>
