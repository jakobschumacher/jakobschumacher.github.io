<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="author" content="{{ .Site.Params.author }}">

<!-- SEO -->
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">

<!-- Favicon -->
<link rel="icon" href="{{ .Site.BaseURL }}favicon.ico">

<!-- Minimal CSS -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    line-height: 1.6;
    color: #333;
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }
  header { border-bottom: 1px solid #ddd; padding-bottom: 20px; margin-bottom: 40px; }
  header h1 { font-size: 2em; margin-bottom: 10px; }
  header h1 a { color: #333; text-decoration: none; }
  header nav { margin-top: 15px; }
  header nav a { margin-right: 20px; color: #0066cc; text-decoration: none; }
  header nav a:hover { text-decoration: underline; }
  main { min-height: 60vh; }
  h1, h2, h3 { margin-top: 1.5em; margin-bottom: 0.5em; }
  article { margin-bottom: 40px; }
  article h2 a { color: #333; text-decoration: none; }
  article h2 a:hover { color: #0066cc; }
  .post-meta { color: #666; font-size: 0.9em; margin-bottom: 10px; }
  .post-list { list-style: none; }
  .post-list li { margin-bottom: 30px; }
  footer { border-top: 1px solid #ddd; padding-top: 20px; margin-top: 60px; text-align: center; color: #666; font-size: 0.9em; }
  .project-item { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
  .project-item h3 a { color: #0066cc; text-decoration: none; }
  .project-item h3 a:hover { text-decoration: underline; }
</style>
