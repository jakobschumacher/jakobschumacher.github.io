{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
      {{ .Date.Format "2006-01-02" }}
      {{ if .Params.tags }}
        | Tags:
        {{ range .Params.tags }}
          <a href="{{ "/tags/" | relURL }}{{ . | urlize }}">{{ . }}</a>
        {{ end }}
      {{ end }}
    </div>
    {{ .Content }}
  </article>
{{ end }}
